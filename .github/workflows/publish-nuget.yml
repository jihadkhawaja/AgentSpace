name: Publish AgentSpace SDK

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Check out the release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag '$RELEASE_TAG' must be a semantic version, optionally prefixed with v." >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Pack AgentSpace.SDK
        run: |
          dotnet pack src/AgentSpace/AgentSpace.csproj --configuration Release --output artifacts \
            -p:AgentSpacePackageVersion="$PACKAGE_VERSION" \
            -p:ContinuousIntegrationBuild=true
          packages=(artifacts/*.nupkg)
          if [[ ${#packages[@]} -ne 1 || ! -f "${packages[0]}" || "${packages[0]}" != artifacts/AgentSpace.SDK.*.nupkg ]]; then
            echo "Expected one AgentSpace.SDK package." >&2
            exit 1
          fi
          echo "PACKAGE_PATH=${packages[0]}" >> "$GITHUB_ENV"

      - name: Authenticate with NuGet Trusted Publishing
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: jihadkhawaja

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "$PACKAGE_PATH" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json" \
            --name github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text
          dotnet nuget push "$PACKAGE_PATH" --source github --api-key "$GITHUB_TOKEN" --skip-duplicate
